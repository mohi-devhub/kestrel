# 4 fake GPU nodes managed by the in-cluster KWOK controller.
# Each node is annotated/tainted per KWOK's convention (kwok.x-k8s.io/node=fake)
# and labeled for fake-gpu-operator's node pool (run.ai/simulated-gpu-node-pool).
# GPU capacity itself is NOT set here — fake-gpu-operator's kwok-gpu-device-plugin
# patches nvidia.com/gpu capacity once it sees the node-pool label.
---
apiVersion: v1
kind: Node
metadata:
  name: kwok-gpu-node-0
  annotations:
    node.alpha.kubernetes.io/ttl: "0"
    kwok.x-k8s.io/node: fake
  labels:
    beta.kubernetes.io/arch: amd64
    beta.kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: kwok-gpu-node-0
    kubernetes.io/os: linux
    kubernetes.io/role: agent
    node-role.kubernetes.io/agent: ""
    type: kwok
    run.ai/simulated-gpu-node-pool: default
spec:
  taints:
    - effect: NoSchedule
      key: kwok.x-k8s.io/node
      value: fake
status:
  allocatable:
    cpu: "16"
    memory: 64Gi
    pods: "110"
  capacity:
    cpu: "16"
    memory: 64Gi
    pods: "110"
  nodeInfo:
    architecture: amd64
    bootID: ""
    containerRuntimeVersion: ""
    kernelVersion: ""
    kubeProxyVersion: fake
    kubeletVersion: fake
    machineID: ""
    operatingSystem: linux
    osImage: ""
    systemUUID: ""
  phase: Running
---
