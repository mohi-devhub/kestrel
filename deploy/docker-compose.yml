name: kestrel

# Shared by the API server and the reconciler — one definition so they can't drift.
x-control-plane-env: &control-plane-env
  DATABASE_URL: postgresql+psycopg://kestrel:kestrel@postgres:5432/kestrel
  REDIS_URL: redis://redis:6379/0
  KUBECONFIG_PATH: /kubeconfig/internal.yaml
  DEFAULT_NAMESPACE: default
  ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kestrel
      POSTGRES_PASSWORD: kestrel
      POSTGRES_DB: kestrel
    ports:
      # Host-side port only — mapped off the default 5432 because a native Postgres
      # on this machine already holds 127.0.0.1:5432. Containers on the compose
      # network still reach this over the internal "postgres:5432" hostname/port,
      # unaffected by this remap.
      - "5433:5432"
    volumes:
      - kestrel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Same reasoning as postgres above — a native redis-server already holds 6379.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: ../control-plane
    environment: *control-plane-env
    volumes:
      - ./kubeconfig/internal.yaml:/kubeconfig/internal.yaml:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - kind

  reconciler:
    build:
      context: ../control-plane
    command: ["python", "-m", "scheduler.reconcile"]
    environment: *control-plane-env
    volumes:
      - ./kubeconfig/internal.yaml:/kubeconfig/internal.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - kind

  autoscaler:
    build:
      context: ../control-plane
    command: ["python", "-m", "autoscale.loop"]
    environment: *control-plane-env
    volumes:
      - ./kubeconfig/internal.yaml:/kubeconfig/internal.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - kind

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # The dashboard queries this directly from its server-side routes; no Grafana
      # in v1, so the retention only has to outlive a demo run.
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - kestrel-prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - control-plane

  dashboard:
    build:
      context: ../dashboard
    environment:
      # Server-side only. The admin token never reaches the browser: every call to
      # the control plane is made from the Next.js server, which is also why the
      # control plane needs no CORS configuration.
      KESTREL_API_URL: http://control-plane:8000
      KESTREL_ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "3000:3000"
    depends_on:
      - control-plane
      - prometheus

networks:
  kind:
    external: true

volumes:
  kestrel-postgres:
  kestrel-prometheus:
