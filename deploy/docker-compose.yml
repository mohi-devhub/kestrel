name: foundry

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry
    ports:
      - "5432:5432"
    volumes:
      - foundry-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: ../control-plane
    environment:
      DATABASE_URL: postgresql+psycopg://foundry:foundry@postgres:5432/foundry
      REDIS_URL: redis://redis:6379/0
      KUBECONFIG_PATH: /kubeconfig/internal.yaml
      DEFAULT_NAMESPACE: default
    volumes:
      - ./kubeconfig/internal.yaml:/kubeconfig/internal.yaml:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - kind

networks:
  kind:
    external: true

volumes:
  foundry-postgres:
